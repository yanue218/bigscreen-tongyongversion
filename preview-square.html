<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>蛇口市场大屏 1.97m × 2m · 等比例预览</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#e8eef6;color:#10315F;font-family:'Microsoft YaHei','PingFang SC',sans-serif;height:100dvh;display:flex;flex-direction:column}
    header{padding:10px 16px;text-align:center;font-size:14px;flex:none}
    header b{letter-spacing:.05em}
    header .tip{display:block;font-size:12px;color:#5E7EA8;margin-top:2px}
    main{flex:1;min-height:0;display:grid;place-items:center;padding:8px 16px 16px}
    .screen{position:relative;overflow:hidden;border-radius:6px;box-shadow:0 12px 44px rgba(31,71,125,.28),0 0 0 1px rgba(16,49,95,.12);background:#F4F8FD}
    iframe{position:absolute;top:0;left:0;width:985px;height:1000px;border:0;transform-origin:top left}
  </style>
</head>
<body>
  <header><b>蛇口市场大屏 · 横 1.97 米 × 竖 2 米 等比例预览</b>
    <span class="tip">窗口内任意缩放均为真实比例；页面交互与全屏展示完全一致 · 商户资料为设计示意</span></header>
  <main><div class="screen"><iframe src="./?preview=design" title="市场大屏等比例交互预览"></iframe></div></main>
  <script type="module">
    // Development preview only. 985 × 1000 simulates the 1.97 m × 2 m ratio, not the panel's physical resolution.
    const area=document.querySelector('main'),screen=document.querySelector('.screen'),frame=document.querySelector('iframe');
    const W=985,H=1000;
    function fit(){
      const scale=Math.min((area.clientWidth-32)/W,(area.clientHeight-24)/H);
      screen.style.width=`${W*scale}px`;
      screen.style.height=`${H*scale}px`;
      frame.style.transform=`scale(${scale})`;
    }
    new ResizeObserver(fit).observe(area);fit();
  </script>
</body>
</html>
